const el = id => document.getElementById(id);
const login = el('login');
const frame = el('workspace');
const businessSelect = el('businessSelect');
const retry = el('retry');
const signOut = el('signOut');
const demo = new TextDecoder().decode(Uint8Array.from(atob(demoBase64), c => c.charCodeAt(0)));
const recordKey = 'laundrypro_demo';
let accessToken = '';
let activeBusiness;
let revision = 0;
let pending;
let saving = false;
let conflict = false;
let frameChannel;

function status(message) {
  el('status').textContent = message;
}

async function api(path, options = {}) {
  const response = await fetch(projectUrl + path, {
    method: options.method || 'GET',
    headers: {
      apikey: publishableKey,
      ...(accessToken ? {Authorization: 'Bearer ' + accessToken} : {}),
      ...(options.body ? {'Content-Type': 'application/json'} : {}),
      ...(options.representation ? {Prefer: 'return=representation'} : {})
    },
    body: options.body && JSON.stringify(options.body),
    cache: 'no-store'
  });
  if (!response.ok) throw Object.assign(new Error('Request failed'), {code: response.status});
  const result = await response.text();
  return result ? JSON.parse(result) : null;
}

async function initialRecords(business) {
  const filter = 'business_id=eq.' + encodeURIComponent(business.id);
  const [clients, orders] = await Promise.all([
    api('/rest/v1/customers?select=id,name,phone&order=id&' + filter),
    api('/rest/v1/laundry_orders?select=*&order=created_at.desc&' + filter)
  ]);
  const mapped = new Map(clients.map((client, i) => [client.id, {...client, id: i + 1, email: ''}]));
  const services = [
    {name:'Wash & Dry',method:'weight',price:35,pinned:true},
    {name:'Washing',method:'weight',price:25},
    {name:'Ironing',method:'weight',price:15},
    {name:'Blanket',method:'item',price:80},
    {name:'Duvet',method:'item',price:120}
  ];
  const migrated = orders.map((order, i) => {
    const client = mapped.get(order.customer_id);
    const method = order.unit === 'kg' ? 'weight' : order.unit;
    const service = {service:order.service,method,qty:Number(order.quantity),unitPrice:Number(order.unit_price)};
    return {
      id:i + 1, customerId:client?.id, customer:client?.name || 'Customer', date:order.created_at,
      ...service, total:Number(order.total), due:Number(order.total), paid:0, notes:'', paymentHistory:[],
      collectionStatus:{Received:'in_store',Ready:'ready',Collected:'collected'}[order.status]
    };
  });
  return {[recordKey]:JSON.stringify({
    business:{name:business.name,setupComplete:true},
    customers:[...mapped.values()],services,orders:migrated,inventory:[],posSales:[],stockMovements:[],recipes:[]
  })};
}

async function openWorkspace(business) {
  const records = await api('/rest/v1/staff_workspaces?select=revision,state&business_id=eq.' + encodeURIComponent(business.id));
  const saved = records[0];
  const values = saved?.state || await initialRecords(business);
  activeBusiness = business;
  revision = saved?.revision || 0;
  conflict = false;
  const encoded = JSON.stringify(values).replaceAll('<','\\u003c');
  frameChannel = crypto.randomUUID();
  const bootstrap = '<scr' + 'ipt>window.workspaceChannel=' + JSON.stringify(frameChannel) + ';window.initialWorkspace=' + encoded + ';</scr' + 'ipt>';
  frame.srcdoc = demo.replace('<body>', () => '<body>' + bootstrap);
  frame.hidden = false;
  login.hidden = true;
  signOut.hidden = false;
  status('');
}

async function flush() {
  if (saving || !pending || conflict) return;
  saving = true;
  businessSelect.disabled = true;
  signOut.disabled = true;
  retry.hidden = true;
  try {
    while (pending) {
      const state = pending;
      const next = revision + 1;
      status('Saving to Laundrix…');
      const path = '/rest/v1/staff_workspaces';
      const result = await api(
        revision ? path + '?business_id=eq.' + encodeURIComponent(activeBusiness.id) + '&revision=eq.' + revision : path,
        {method: revision ? 'PATCH' : 'POST', representation:true,
         body: revision ? {revision:next,state} : {business_id:activeBusiness.id,revision:next,state}}
      );
      if (result?.length !== 1) throw Object.assign(new Error('Conflict'),{code:409});
      revision = next;
      if (pending === state) pending = undefined;
    }
    status('Saved online.');
  } catch (error) {
    if (error.code === 409) {
      conflict = true;
      status('Another session changed this workspace. Your latest changes were not saved. Reopen the page to load the online copy.');
    } else {
      status('Changes are still in this tab. Keep it open and retry the save.');
      retry.hidden = false;
    }
  } finally {
    saving = false;
    businessSelect.disabled = Boolean(pending);
    signOut.disabled = Boolean(pending);
  }
}

window.addEventListener('message', event => {
  if (event.source !== frame.contentWindow || event.origin !== 'null' || event.data?.type !== 'laundrix-save' || event.data.channel !== frameChannel || !activeBusiness) return;
  const values = event.data.values;
  if (!values || typeof values[recordKey] !== 'string') return;
  const permitted = Object.fromEntries(Object.entries(values).filter(([key,value]) =>
    ['laundrypro_demo','laundrypro_theme','laundrypro_custom_theme_v1','laundrypro_invoice_template_v1'].includes(key) && typeof value === 'string'));
  pending = permitted;
  flush();
});
retry.addEventListener('click', flush);
window.addEventListener('beforeunload', event => {
  if (pending) {event.preventDefault();event.returnValue = '';}
});
login.addEventListener('submit', async event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(login));
  login.reset();
  login.querySelector('button').disabled = true;
  try {
    const session = await api('/auth/v1/token?grant_type=password',{method:'POST',body:fields});
    accessToken = session.access_token;
    const businesses = await api('/rest/v1/businesses?select=id,name&order=name.asc');
    if (!businesses.length) throw new Error('No business assigned');
    businessSelect.replaceChildren(...businesses.map(value => new Option(value.name, value.id)));
    await openWorkspace(businesses[0]);
    businessSelect.hidden = businesses.length < 2;
    businessSelect.onchange = async () => {
      if (pending || saving) return;
      frame.hidden = true;
      businessSelect.disabled = true;
      try {await openWorkspace(businesses.find(value => value.id === businessSelect.value));}
      catch {frame.hidden = false;businessSelect.value = activeBusiness.id;status('Could not open that business.');}
      finally {businessSelect.disabled = false;}
    };
  } catch (error) {
    accessToken = '';
    status(error.code === 400 ? 'Sign-in failed. Check your email and password.' : 'Could not open your Laundrix workspace. Check your connection or staff assignment.');
  } finally {
    login.querySelector('button').disabled = false;
  }
});
signOut.addEventListener('click', async () => {
  if (pending || saving) return;
  try {await api('/auth/v1/logout?scope=local',{method:'POST'});} catch {}
  accessToken = '';
  activeBusiness = undefined;
  frameChannel = undefined;
  frame.srcdoc = '';
  frame.hidden = businessSelect.hidden = signOut.hidden = true;
  login.hidden = false;
  status('Signed out.');
});

</script>
</body>
</html>

function status(message) {
  el('status').textContent = message;
}

async function api(path, options = {}) {
  const response = await fetch(projectUrl + path, {
    method: options.method || 'GET',
    headers: {
      apikey: publishableKey,
      ...(accessToken ? {Authorization: 'Bearer ' + accessToken} : {}),
      ...(options.body ? {'Content-Type': 'application/json'} : {}),
      ...(options.representation ? {Prefer: 'return=representation'} : {})
    },
    body: options.body && JSON.stringify(options.body),
    cache: 'no-store'
  });
  if (!response.ok) throw Object.assign(new Error('Request failed'), {code: response.status});
  const result = await response.text();
  return result ? JSON.parse(result) : null;
}

async function initialRecords(business) {
  const filter = 'business_id=eq.' + encodeURIComponent(business.id);
  const [clients, orders] = await Promise.all([
    api('/rest/v1/customers?select=id,name,phone&order=id&' + filter),
    api('/rest/v1/laundry_orders?select=*&order=created_at.desc&' + filter)
  ]);
  const mapped = new Map(clients.map((client, i) => [client.id, {...client, id: i + 1, email: ''}]));
  const services = [
    {name:'Wash & Dry',method:'weight',price:35,pinned:true},
    {name:'Washing',method:'weight',price:25},
    {name:'Ironing',method:'weight',price:15},
    {name:'Blanket',method:'item',price:80},
    {name:'Duvet',method:'item',price:120}
  ];
  const migrated = orders.map((order, i) => {
    const client = mapped.get(order.customer_id);
    const method = order.unit === 'kg' ? 'weight' : order.unit;
    const service = {service:order.service,method,qty:Number(order.quantity),unitPrice:Number(order.unit_price)};
    return {
      id:i + 1, customerId:client?.id, customer:client?.name || 'Customer', date:order.created_at,
      ...service, total:Number(order.total), due:Number(order.total), paid:0, notes:'', paymentHistory:[],
      collectionStatus:{Received:'in_store',Ready:'ready',Collected:'collected'}[order.status]
    };
  });
  return {[recordKey]:JSON.stringify({
    business:{name:business.name,setupComplete:true},
    customers:[...mapped.values()],services,orders:migrated,inventory:[],posSales:[],stockMovements:[],recipes:[]
  })};
}

async function openWorkspace(business) {
  const records = await api('/rest/v1/staff_workspaces?select=revision,state&business_id=eq.' + encodeURIComponent(business.id));
  const saved = records[0];
  const values = saved?.state || await initialRecords(business);
  activeBusiness = business;
  revision = saved?.revision || 0;
  conflict = false;
  const encoded = JSON.stringify(values).replaceAll('<','\\u003c');
  frameChannel = crypto.randomUUID();
  const bootstrap = '<scr' + 'ipt>window.workspaceChannel=' + JSON.stringify(frameChannel) + ';window.initialWorkspace=' + encoded + ';</scr' + 'ipt>';
  frame.srcdoc = demo.replace('<body>', () => '<body>' + bootstrap);
  frame.hidden = false;
  login.hidden = true;
  signOut.hidden = false;
  status('');
}

async function flush() {
  if (saving || !pending || conflict) return;
  saving = true;
  businessSelect.disabled = true;
  signOut.disabled = true;
  retry.hidden = true;
  try {
    while (pending) {
      const state = pending;
      const next = revision + 1;
      status('Saving to Laundrix…');
      const path = '/rest/v1/staff_workspaces';
      const result = await api(
        revision ? path + '?business_id=eq.' + encodeURIComponent(activeBusiness.id) + '&revision=eq.' + revision : path,
        {method: revision ? 'PATCH' : 'POST', representation:true,
         body: revision ? {revision:next,state} : {business_id:activeBusiness.id,revision:next,state}}
      );
      if (result?.length !== 1) throw Object.assign(new Error('Conflict'),{code:409});
      revision = next;
      if (pending === state) pending = undefined;
    }
    status('Saved online.');
  } catch (error) {
    if (error.code === 409) {
      conflict = true;
      status('Another session changed this workspace. Your latest changes were not saved. Reopen the page to load the online copy.');
    } else {
      status('Changes are still in this tab. Keep it open and retry the save.');
      retry.hidden = false;
    }
  } finally {
    saving = false;
    businessSelect.disabled = Boolean(pending);
    signOut.disabled = Boolean(pending);
  }
}

function displayCustomerDraft({delivery, recipient, message, subject}) {
  if (typeof recipient !== 'string' || typeof message !== 'string' || message.length > 30000) return;
  let href;
  if (delivery === 'whatsapp' && /^27[1-9][0-9]{8}$/.test(recipient)) {
    href = 'https://wa.me/' + recipient + '?text=' + encodeURIComponent(message);
  } else if (delivery === 'email' && /^[^\s@,;?&#]+@[a-z0-9.-]+\.[a-z]{2,}$/i.test(recipient) && typeof subject === 'string') {
    href = 'mailto:' + encodeURIComponent(recipient).replace('%40', '@') + '?subject=' + encodeURIComponent(subject) + '&body=' + encodeURIComponent(message);
  } else {
    status('Check the customer’s saved phone number or email address.');
    return;
  }
  const dialog = el('customerDraft');
  const link = el('draftLink');
  el('draftRecipient').textContent = 'To: ' + recipient;
  el('draftPreview').textContent = message;
  link.href = href;
  link.textContent = delivery === 'email' ? 'Open email draft' : 'Open WhatsApp draft';
  if (delivery === 'email') link.removeAttribute('target');
  else link.target = '_blank';
  if (!dialog.open) dialog.showModal();
}
el('closeDraft').addEventListener('click', () => el('customerDraft').close());

function showInvoiceActions(invoice) {
  const chat = el('invoiceWhatsApp');
  const help = el('invoiceShareHelp');
  const phone = typeof invoice?.phone === 'string' && /^27[1-9][0-9]{8}$/.test(invoice.phone) ? invoice.phone : '';
  chat.hidden = !phone;
  chat.removeAttribute('href');
  if (phone) {
    const message = 'Hello, please see the attached laundry invoice. Thank you.';
    chat.href = 'https://wa.me/' + phone + '?text=' + encodeURIComponent(message);
  }
  help.hidden = !invoice;
  help.textContent = phone
    ? 'Choose Print / Save as PDF, then select Save as PDF. Open WhatsApp and attach the saved PDF before sending.'
    : 'Choose Print / Save as PDF, then select Save as PDF. Add a valid South African mobile number to the customer record to open their WhatsApp chat here.';
}

function displayDocumentPreview({title, markup, invoice}) {
  if (typeof markup !== 'string' || markup.length > 4_000_000 || typeof title !== 'string') return;
  const inert = document.createElement('template');
  inert.innerHTML = markup;
  inert.content.querySelectorAll('script, meta, base, link, iframe, frame, object, embed, form, a, .no-print').forEach(node=>node.remove());
  const policy = "default-src 'none'; style-src 'unsafe-inline'; img-src data:; form-action 'none'; base-uri 'none'";
  const body = markup.match(/<body\s+class="(invoice-[a-z-]+)">/i)?.[1];
  showInvoiceActions(invoice);
  el('documentPreviewTitle').textContent = title;
  printableDocument.srcdoc = '<!doctype html><html><head><meta http-equiv="Content-Security-Policy" content="'+policy+'"></head><body'+(body?' class="'+body+'"':'')+'>'+inert.innerHTML+'</body></html>';
  if (!documentPreview.open) documentPreview.showModal();
}

window.addEventListener('message', event => {
  if (event.source !== frame.contentWindow || event.origin !== 'null' || event.data?.channel !== frameChannel || !activeBusiness) return;
  if (event.data.type === 'laundrix-document') return displayDocumentPreview(event.data);
  if (event.data.type === 'laundrix-draft') return displayCustomerDraft(event.data);
  if (event.data.type !== 'laundrix-save') return;
  const values = event.data.values;
  if (!values || typeof values[recordKey] !== 'string') return;
  const permitted = Object.fromEntries(Object.entries(values).filter(([key,value]) =>
    ['laundrypro_demo','laundrypro_theme','laundrypro_custom_theme_v1','laundrypro_invoice_template_v1'].includes(key) && typeof value === 'string'));
  pending = permitted;
  flush();
});
retry.addEventListener('click', flush);
window.addEventListener('beforeunload', event => {
  if (pending) {event.preventDefault();event.returnValue = '';}
});
const ownerMode = new URLSearchParams(location.search).get('view') === 'owner';
const ownerView = el('ownerView');
const ownerShop = el('ownerShop');
const ownerDate = el('ownerDate');
const ownerRefresh = el('ownerRefresh');
const ownerCurrency = new Intl.NumberFormat('en-ZA', {style:'currency', currency:'ZAR'});
const ownerCalendar = new Intl.DateTimeFormat('en-CA', {timeZone:'Africa/Johannesburg', year:'numeric',month:'2-digit',day:'2-digit'});
let ownerShops = [];
let ownerSnapshots = [];
let ownerRequest = 0;

function ownerDay(value) {
  const date = new Date(value);
  return value && Number.isFinite(+date) ? ownerCalendar.format(date) : '';
}
function ownerCents(value) {return Math.round((Number(value)||0)*100);}
function ownerTotals(data, day) {
  const totals = {sales:0, cash:0, card:0, eft:0, other:0, pending:0, ready:0, low:0};
  function payment(method, amount) {
    method = String(method||'').trim().toLowerCase();
    totals[['cash','card','eft'].includes(method)?method:'other'] += amount;
  }
  for (const order of data.orders||[]) {
    if (order.collectionStatus==='ready') totals.ready++;
    else if (order.collectionStatus!=='collected') totals.pending++;
    const history = Array.isArray(order.paymentHistory) ? order.paymentHistory : [];
    if (ownerDay(order.date)===day) {
      totals.sales += ownerCents(order.total);
      const remainder = ownerCents(order.paid)-history.reduce((sum,item)=>sum+ownerCents(item.amount),0);
      if (remainder) payment(order.payMethod,remainder);
    }
    for (const entry of history) if (ownerDay(entry.date)===day) payment(entry.method,ownerCents(entry.amount));
  }
  for (const sale of data.posSales||[]) if (ownerDay(sale.date)===day) {
    totals.sales += ownerCents(sale.total);
    payment(sale.method,ownerCents(sale.total));
  }
  totals.low = (data.inventory||[]).filter(item=>Number(item.qty)<=Number(item.min)).length;
  const close = (data.cashUps||[]).find(item=>item.date===day);
  return {totals,close};
}
function addOwnerLine(parent, tag, value) {
  const element = document.createElement(tag);
  element.textContent=value;
  parent.append(element);
}
function drawOwner() {
  const results=el('ownerResults');
  results.replaceChildren();
  const format=cents=>ownerCurrency.format(cents/100);
  const selected=ownerSnapshots.filter(shop=>!ownerShop.value||shop.id===ownerShop.value);
  const rollup={sales:0,received:0,ready:0,pending:0};
  const cards=[];
  for (const shop of selected) {
    const card=document.createElement('article');
    addOwnerLine(card,'h3',shop.name);
    if (!shop.data) {
      addOwnerLine(card,'p','No saved workspace figures available.');
    } else {
      const {totals:t,close}=ownerTotals(shop.data,ownerDate.value);
      const received=t.cash+t.card+t.eft+t.other;
      rollup.sales+=t.sales;rollup.received+=received;
      rollup.ready+=t.ready;rollup.pending+=t.pending;
      addOwnerLine(card,'p','Payments received '+format(received));
      addOwnerLine(card,'p','Cash '+format(t.cash)+' · Card '+format(t.card)+' · EFT '+format(t.eft)+' · Other '+format(t.other));
      addOwnerLine(card,'p',t.pending+' in progress · '+t.ready+' ready · '+t.low+' low-stock items');
      addOwnerLine(card,'p',close?(close.balanced?'Cash-up balanced':'Cash-up discrepancy recorded'):'Cash-up pending');
      if(close&&!close.balanced&&close.note)addOwnerLine(card,'p','Closing note: '+close.note);
    }
    cards.push(card);
  }
  if (selected.some(shop=>shop.data)) {
    const summary=document.createElement('article');
    addOwnerLine(summary,'h3',ownerShop.value?'Shop summary':'All shops summary');
    addOwnerLine(summary,'p','Sales '+format(rollup.sales)+' · Payments received '+format(rollup.received));
    addOwnerLine(summary,'p',rollup.pending+' in progress · '+rollup.ready+' ready now');
    results.append(summary);
  }
  results.append(...cards);
}
async function refreshOwner() {
  const request=++ownerRequest;
  ownerRefresh.disabled=true;
  el('ownerSync').textContent='Refreshing…';
  try {
    const snapshots=await Promise.all(ownerShops.map(async shop=>{
      const history=await api('/rest/v1/staff_workspaces?select=state&business_id=eq.'+encodeURIComponent(shop.id));
      const raw=history[0]?.state?.[recordKey];
      return {...shop,data:typeof raw==='string'?JSON.parse(raw):null};
    }));
    if(request!==ownerRequest)return;
    ownerSnapshots=snapshots;
    drawOwner();
    el('ownerSync').textContent='Refreshed '+new Date().toLocaleTimeString('en-ZA',{timeZone:'Africa/Johannesburg'});
  } catch {
    if(request!==ownerRequest)return;
    el('ownerSync').textContent='Could not refresh. Sign in again if your session expired.';
  } finally {
    if(request===ownerRequest)ownerRefresh.disabled=false;
  }
}
async function openOwner(businesses,userId) {
  const memberships=await api('/rest/v1/business_members?select=business_id,staff_role&user_id=eq.'+encodeURIComponent(userId)+'&staff_role=eq.owner');
  const allowed=new Set(memberships.map(item=>item.business_id));
  ownerShops=businesses.filter(shop=>allowed.has(shop.id));
  if(!ownerShops.length)throw new Error('Owner access required');
  ownerShop.replaceChildren(new Option('All shops',''),...ownerShops.map(shop=>new Option(shop.name,shop.id)));
  ownerDate.value=ownerDay(new Date());
  login.hidden=true;
  signOut.hidden=false;
  ownerView.hidden=false;
  status('');
  await refreshOwner();
}
ownerShop.addEventListener('change',drawOwner);
ownerDate.addEventListener('change',drawOwner);
ownerRefresh.addEventListener('click',refreshOwner);
if(ownerMode){
  login.querySelector('h1').textContent='Owner sign-in';
  document.querySelector('header strong').textContent='Laundrix Owner';
  el('workspaceMode').textContent='Staff sign-in';
  el('workspaceMode').href='staff-workspace.html';
}

login.addEventListener('submit', async event => {
  event.preventDefault();
  const fields = Object.fromEntries(new FormData(login));
  login.reset();
  login.querySelector('button').disabled = true;
  try {
    const session = await api('/auth/v1/token?grant_type=password',{method:'POST',body:fields});
    accessToken = session.access_token;
    const businesses = await api('/rest/v1/businesses?select=id,name&order=name.asc');
    if(ownerMode)return await openOwner(businesses,session.user.id);
    if (!businesses.length) throw new Error('No business assigned');
    businessSelect.replaceChildren(...businesses.map(value => new Option(value.name, value.id)));
    await openWorkspace(businesses[0]);
    businessSelect.hidden = businesses.length < 2;
    businessSelect.onchange = async () => {
      if (pending || saving) return;
      frame.hidden = true;
      businessSelect.disabled = true;
      try {await openWorkspace(businesses.find(value => value.id === businessSelect.value));}
      catch {frame.hidden = false;businessSelect.value = activeBusiness.id;status('Could not open that business.');}
      finally {businessSelect.disabled = false;}
    };
  } catch (error) {
    accessToken = '';
    status(error.message === 'Owner access required' ? 'This login has no owner access.' : error.code === 400 ? 'Sign-in failed. Check your email and password.' : 'Could not open your Laundrix workspace. Check your connection or staff assignment.');
  } finally {
    login.querySelector('button').disabled = false;
  }
});
signOut.addEventListener('click', async () => {
  if (pending || saving) return;
  try {await api('/auth/v1/logout?scope=local',{method:'POST'});} catch {}
  accessToken = '';
  activeBusiness = undefined;
  frameChannel = undefined;
  ownerRequest++;
  ownerSnapshots=[];
  ownerShops=[];
  ownerView.hidden=true;
  el('ownerResults').replaceChildren();
  frame.srcdoc = '';
  frame.hidden = businessSelect.hidden = signOut.hidden = true;
  login.hidden = false;
  status('Signed out.');
});

</script>
